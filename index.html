<!DOCTYPE html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тунг Тунг Сахур • YOU EDITION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #07090f;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .hud-top {
            position: absolute;
            top: 18px;
            left: 22px;
            z-index: 10;
            pointer-events: none;
        }
        .badge {
            display: inline-block;
            background: rgba(255, 145, 0, 0.22);
            border: 1px solid rgba(255, 166, 0, 0.55);
            color: #ffb74d;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff3e0;
            text-shadow: 0 3px 16px rgba(255, 136, 0, 0.65);
            line-height: 1.1;
        }
        .subtitle {
            margin-top: 4px;
            font-size: 0.85rem;
            color: #b0bec5;
        }
        .face-tuner {
            position: absolute;
            top: 18px;
            right: 20px;
            background: rgba(18, 20, 28, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 167, 38, 0.45);
            border-radius: 14px;
            padding: 12px 14px;
            z-index: 12;
            width: 225px;
            display: none;
            flex-direction: column;
            gap: 8px;
            font-size: 0.8rem;
        }
        .face-tuner.visible {
            display: flex;
        }
        .face-tuner-title {
            font-weight: 700;
            color: #ffb74d;
            margin-bottom: 2px;
        }
        .tuner-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .tuner-row input[type="range"] {
            width: 100%;
            accent-color: #ff9800;
            cursor: pointer;
        }
        .sahur-banner {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 3.8rem;
            font-weight: 900;
            color: #ff9800;
            text-shadow: 0 0 28px rgba(255, 111, 0, 0.9), 0 4px 0 #3e1f00;
            letter-spacing: 3px;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.12s cubic-bezier(0.17, 0.89, 0.32, 1.49), opacity 0.15s;
            z-index: 15;
            white-space: nowrap;
        }
        .sahur-banner.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            z-index: 10;
            width: 96%;
            max-width: 960px;
        }
        button, .file-label {
            background: rgba(25, 22, 20, 0.88);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1.5px solid rgba(255, 167, 38, 0.5);
            padding: 11px 18px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 13px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        button.primary, .file-label.photo-btn {
            background: linear-gradient(135deg, #e65100, #ff8f00);
            border-color: #ffd54f;
            color: #fff;
        }
        button.save-btn {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            border-color: #81c784;
            color: #fff;
        }
        button:hover, .file-label:hover {
            transform: translateY(-2px);
            border-color: #ffd54f;
        }
        button:active, .file-label:active {
            transform: scale(0.95);
        }
        input[type="file"] {
            display: none;
        }
        .hint {
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
        }
    </style>

        }
    </script>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a12);
        scene.fog = new THREE.FogExp2(0x070a12, 0.032);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 120);
        function resetCameraFraming() {
            const aspect = window.innerWidth / window.innerHeight;
            const dist = aspect < 1 ? 10.5 : 8.4;
            camera.position.set(0, 1.85, dist);
        }
        resetCameraFraming();

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0, 1.65, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 2.5;
        controls.maxDistance = 16;

        // --- ТЕКСТУРА ЛИЦА (ПОДДЕРЖКА ВШИТОГО ФОТО И РЕДАКТОРА) ---
        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = 512;
        faceCanvas.height = 512;
        const faceCtx = faceCanvas.getContext('2d');

        const faceTexture = new THREE.CanvasTexture(faceCanvas);
        faceTexture.colorSpace = THREE.SRGBColorSpace;

        const bakedFaceData = document.body.getAttribute('data-baked-face');
        let loadedUserImage = null;
        const photoSettings = {
            zoom: 1.45,
            stretchX: 1.15,
            offsetY: -0.16,
            offsetX: 0.0
        };

        function drawPlaceholderFace() {
            faceCtx.fillStyle = '#ecc0a4';
            faceCtx.fillRect(0, 0, 512, 512);
            faceCtx.fillStyle = '#3b2416';
            faceCtx.font = 'bold 28px Segoe UI, sans-serif';
            faceCtx.textAlign = 'center';
            faceCtx.fillText('НАЖМИ ВНИЗУ', 256, 215);
            faceCtx.fillStyle = '#e65100';
            faceCtx.font = '900 32px Segoe UI, sans-serif';
            faceCtx.fillText('«НАТЯНУТЬ МОЁ ФОТО»', 256, 260);
            faceCtx.fillStyle = '#4e342e';
            faceCtx.font = '22px Segoe UI, sans-serif';
            faceCtx.fillText('или перетащи фотку сюда', 256, 305);
            faceTexture.needsUpdate = true;
        }

        if (bakedFaceData) {
            // Загружаем уже вшитое фото — редактирование заблокировано
            const bakedImg = new Image();
            bakedImg.onload = () => {
                faceCtx.drawImage(bakedImg, 0, 0, 512, 512);
                faceTexture.needsUpdate = true;
            };
            bakedImg.src = bakedFaceData;
        } else {
            drawPlaceholderFace();
        }

        function renderPhotoToHeadTexture() {
            if (!loadedUserImage) return;
            faceCtx.fillStyle = '#e7b99c';
            faceCtx.fillRect(0, 0, 512, 512);

            const img = loadedUserImage;
            const imgAspect = img.width / img.height;
            let drawW, drawH;

            if (imgAspect < 1) {
                drawW = 512 * photoSettings.zoom * photoSettings.stretchX;
                drawH = (512 / imgAspect) * photoSettings.zoom;
            } else {
                drawH = 512 * photoSettings.zoom;
                drawW = 512 * imgAspect * photoSettings.zoom * photoSettings.stretchX;
            }

            const drawX = (512 - drawW) / 2 + photoSettings.offsetX * 512;
            const drawY = (512 - drawH) / 2 - photoSettings.offsetY * 512;

            faceCtx.save();
            faceCtx.beginPath();
            faceCtx.ellipse(256, 256, 232, 245, 0, 0, Math.PI * 2);
            faceCtx.clip();
            faceCtx.drawImage(img, drawX, drawY, drawW, drawH);
            faceCtx.restore();

            const grad = faceCtx.createRadialGradient(256, 256, 175, 256, 256, 252);
            grad.addColorStop(0, 'rgba(231, 185, 156, 0)');
            grad.addColorStop(0.82, 'rgba(231, 185, 156, 0.35)');
            grad.addColorStop(1, 'rgba(231, 185, 156, 1)');
            faceCtx.fillStyle = grad;
            faceCtx.fillRect(0, 0, 512, 512);

            faceTexture.needsUpdate = true;
        }

        // --- МАТЕРИАЛЫ И 3D-МОДЕЛЬ ---
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xe7b99c, roughness: 0.55 });
        const headPhotoMat = new THREE.MeshStandardMaterial({ map: faceTexture, roughness: 0.45, metalness: 0.02 });
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x241913, roughness: 0.88 });
        const greenSweaterMat = new THREE.MeshStandardMaterial({ color: 0x2c6b53, roughness: 0.82 });
        const whiteCollarMat = new THREE.MeshStandardMaterial({ color: 0xf7f9fc, roughness: 0.65 });
        const darkPantsMat = new THREE.MeshStandardMaterial({ color: 0x181b22, roughness: 0.78 });
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0x2b1d14, roughness: 0.5 });
        const drumWoodMat = new THREE.MeshStandardMaterial({ color: 0x9c5525, roughness: 0.55 });
        const drumHeadMat = new THREE.MeshStandardMaterial({ color: 0xdcc3a1, roughness: 0.7 });

        function createAsphaltTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#191c24';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 15000; i++) {
                const v = 22 + Math.random() * 26;
                ctx.fillStyle = `rgb(${v},${v},${v + 5})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(8, 8);
            return tex;
        }

        const characterRoot = new THREE.Group();
        scene.add(characterRoot);

        const podiumGroup = new THREE.Group();
        const podiumBase = new THREE.Mesh(
            new THREE.CylinderGeometry(1.15, 1.22, 0.1, 48),
            new THREE.MeshStandardMaterial({ color: 0x5c3820, roughness: 0.75 })
        );
        podiumBase.position.y = 0.05;
        const podiumRing = new THREE.Mesh(
            new THREE.TorusGeometry(1.2, 0.035, 16, 64),
            new THREE.MeshBasicMaterial({ color: 0xff9800 })
        );
        podiumRing.rotation.x = Math.PI / 2;
        podiumRing.position.y = 0.06;
        podiumGroup.add(podiumBase, podiumRing);
        scene.add(podiumGroup);

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.31, 1.18, 32), greenSweaterMat);
        torso.position.y = 1.62;
        characterRoot.add(torso);

        const shoulderCap = new THREE.Mesh(
            new THREE.SphereGeometry(0.36, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2),
            greenSweaterMat
        );
        shoulderCap.scale.set(1.05, 0.55, 0.95);
        shoulderCap.position.y = 2.18;
        characterRoot.add(shoulderCap);

        const collarNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.21, 0.14, 24), whiteCollarMat);
        collarNeck.position.y = 2.32;
        characterRoot.add(collarNeck);

        const collarFlapL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.26), whiteCollarMat);
        collarFlapL.position.set(-0.11, 2.28, 0.21);
        collarFlapL.rotation.set(0.35, 0.25, -0.35);

        const collarFlapR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.26), whiteCollarMat);
        collarFlapR.position.set(0.11, 2.28, 0.21);
        collarFlapR.rotation.set(0.35, -0.25, 0.35);
        characterRoot.add(collarFlapL, collarFlapR);

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.24, 24), skinMat);
        neck.position.y = 2.42;
        characterRoot.add(neck);

        const headGroup = new THREE.Group();
        headGroup.position.set(0, 2.86, 0.02);
        characterRoot.add(headGroup);

        const headRadius = 0.42;
        const headGeo = new THREE.SphereGeometry(headRadius, 48, 48);
        const posAttr = headGeo.attributes.position;
        const uvAttr = headGeo.attributes.uv;
        for (let i = 0; i < posAttr.count; i++) {
            const nx = posAttr.getX(i) / headRadius;
            const ny = posAttr.getY(i) / headRadius;
            const nz = posAttr.getZ(i) / headRadius;
            if (nz > -0.1) {
                uvAttr.setXY(
                    i,
                    THREE.MathUtils.clamp(0.5 + nx * 0.48, 0.02, 0.98),
                    THREE.MathUtils.clamp(0.5 + ny * 0.48, 0.02, 0.98)
                );
            } else {
                uvAttr.setXY(i, 0.02, 0.02);
            }
        }
        uvAttr.needsUpdate = true;

        const headMesh = new THREE.Mesh(headGeo, headPhotoMat);
        headMesh.scale.set(0.95, 1.16, 0.94);
        headGroup.add(headMesh);

        const earGeo = new THREE.SphereGeometry(0.085, 16, 16);
        const leftEar = new THREE.Mesh(earGeo, skinMat);
        leftEar.position.set(-0.39, -0.02, -0.04);
        leftEar.scale.set(0.45, 1.05, 0.8);
        const rightEar = new THREE.Mesh(earGeo, skinMat);
        rightEar.position.set(0.39, -0.02, -0.04);
        rightEar.scale.set(0.45, 1.05, 0.8);
        headGroup.add(leftEar, rightEar);

        const hairGroup = new THREE.Group();
        headGroup.add(hairGroup);
        const curlGeometry = new THREE.SphereGeometry(0.068, 10, 10);
        for (let i = 0; i < 240; i++) {
            const theta = Math.random() * Math.PI * 0.82;
            const phi = Math.random() * Math.PI * 2;
            const rx = 0.41 * Math.sin(theta) * Math.cos(phi);
            const ry = 0.49 * Math.cos(theta) + 0.03;
            const rz = 0.41 * Math.sin(theta) * Math.sin(phi);
            if (rz > 0.14 && ry < 0.25) continue;

            const curl = new THREE.Mesh(curlGeometry, hairMat);
            curl.scale.setScalar(0.75 + Math.random() * 0.55);
            curl.position.set(rx, ry, rz);
            hairGroup.add(curl);
        }

        function createArm(side) {
            const sh = new THREE.Group();
            sh.position.set(side * 0.44, 2.12, 0);
            const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.082, 0.46, 16), greenSweaterMat);
            upperArm.position.y = -0.2;
            sh.add(upperArm);

            const elbow = new THREE.Group();
            elbow.position.y = -0.42;
            const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.068, 0.42, 16), greenSweaterMat);
            forearm.position.y = -0.19;
            elbow.add(forearm);

            const hand = new THREE.Mesh(new THREE.SphereGeometry(0.072, 16, 16), skinMat);
            hand.position.y = -0.41;
            elbow.add(hand);

            sh.add(elbow);
            return { sh, elbow };
        }

        const leftArm = createArm(-1);
        const rightArm = createArm(1);
        characterRoot.add(leftArm.sh, rightArm.sh);

        leftArm.sh.rotation.set(0.35, 0.25, -0.15);
        leftArm.elbow.rotation.set(-0.85, 0.45, 0);
        rightArm.sh.rotation.set(0.25, -0.25, 0.15);
        rightArm.elbow.rotation.set(-0.75, -0.35, 0);

        const drumGroup = new THREE.Group();
        drumGroup.position.set(0.05, -0.42, 0.24);
        drumGroup.rotation.set(0.45, 0.5, -0.35);
        const drumShell = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.58, 24), drumWoodMat);
        drumShell.rotation.x = Math.PI / 2;
        const drumTop = new THREE.Mesh(new THREE.CylinderGeometry(0.162, 0.162, 0.03, 24), drumHeadMat);
        drumTop.rotation.x = Math.PI / 2;
        drumTop.position.z = 0.28;
        drumGroup.add(drumShell, drumTop);
        leftArm.elbow.add(drumGroup);

        const beater = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.018, 0.46, 12), drumWoodMat);
        beater.position.set(0, -0.38, 0.16);
        beater.rotation.x = Math.PI / 2.8;
        rightArm.elbow.add(beater);

        function createLeg(side) {
            const hip = new THREE.Group();
            hip.position.set(side * 0.17, 1.04, 0);
            const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.095, 0.48, 16), darkPantsMat);
            thigh.position.y = -0.22;
            hip.add(thigh);

            const shinGroup = new THREE.Group();
            shinGroup.position.y = -0.44;
            const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.44, 16), darkPantsMat);
            shin.position.y = -0.21;
            shinGroup.add(shin);

            const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.09, 0.28), shoeMat);
            shoe.position.set(0, -0.44, 0.05);
            shinGroup.add(shoe);

            hip.add(shinGroup);
            return { hip, shinGroup };
        }

        const leftLeg = createLeg(-1);
        const rightLeg = createLeg(1);
        characterRoot.add(leftLeg.hip, rightLeg.hip);

        // --- НОЧНАЯ УЛИЦА БЕЗ ПОСТОРОННИХ ЛЮДЕЙ ---
        const environmentGroup = new THREE.Group();
        scene.add(environmentGroup);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(60, 60),
            new THREE.MeshStandardMaterial({ map: createAsphaltTexture(), roughness: 0.9 })
        );
        road.rotation.x = -Math.PI / 2;
        environmentGroup.add(road);

        const roadLine = new THREE.Mesh(
            new THREE.PlaneGeometry(0.16, 45),
            new THREE.MeshBasicMaterial({ color: 0xd99b26 })
        );
        roadLine.rotation.x = -Math.PI / 2;
        roadLine.position.set(-2.2, 0.01, -5);
        environmentGroup.add(roadLine);

        const houseMat = new THREE.MeshStandardMaterial({ color: 0x0e131f, roughness: 0.95 });
        [
            { x: -7.5, z: -11, w: 6, h: 6.2, d: 5 },
            { x: 0.5, z: -14, w: 7.5, h: 5.0, d: 5 },
            { x: 8.0, z: -10.5, w: 6.2, h: 6.8, d: 5 }
        ].forEach((b) => {
            const house = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), houseMat);
            house.position.set(b.x, b.h / 2, b.z);
            environmentGroup.add(house);
        });

        const poleMat = new THREE.MeshStandardMaterial({ color: 0x1c2029, roughness: 0.5 });
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, 6.4, 16), poleMat);
        pole.position.set(-2.6, 3.2, -1.8);
        environmentGroup.add(pole);

        const armBar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 12), poleMat);
        armBar.position.set(-1.6, 6.2, -1.4);
        armBar.rotation.z = -Math.PI / 2.2;
        armBar.rotation.y = -0.35;
        environmentGroup.add(armBar);

        const lampBulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffd180 })
        );
        lampBulb.position.set(-0.65, 6.05, -1.05);
        environmentGroup.add(lampBulb);

        const hemiLight = new THREE.HemisphereLight(0xfff5e6, 0x3a2e25, 1.85);
        scene.add(hemiLight);
        const frontLight = new THREE.DirectionalLight(0xfff0dd, 1.35);
        frontLight.position.set(0.5, 4.5, 6.0);
        scene.add(frontLight);
        const warmGlow = new THREE.PointLight(0xffb74d, 8, 15);
        warmGlow.position.set(-0.65, 5.8, -0.8);
        scene.add(warmGlow);

        // --- РЕДАКТОР И ЭКСПОРТ ЗАБЛОКИРОВАННОГО ФАЙЛА (ТОЛЬКО ПОКА ФОТО НЕ ВШИТО) ---
        if (!bakedFaceData) {
            function handleImageFile(file) {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedUserImage = img;
                        renderPhotoToHeadTexture();
                        document.getElementById('faceTuner').classList.add('visible');
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }

            document.getElementById('photoInput').addEventListener('change', (e) => {
                handleImageFile(e.target.files[0]);
            });

            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length) handleImageFile(e.dataTransfer.files[0]);
            });

            document.getElementById('zoomRange').addEventListener('input', (e) => {
                photoSettings.zoom = parseFloat(e.target.value);
                renderPhotoToHeadTexture();
            });
            document.getElementById('stretchRange').addEventListener('input', (e) => {
                photoSettings.stretchX = parseFloat(e.target.value);
                renderPhotoToHeadTexture();
            });
            document.getElementById('offsetYRange').addEventListener('input', (e) => {
                photoSettings.offsetY = parseFloat(e.target.value);
                renderPhotoToHeadTexture();
            });
            document.getElementById('offsetXRange').addEventListener('input', (e) => {
                photoSettings.offsetX = parseFloat(e.target.value);
                renderPhotoToHeadTexture();
            });

            // Кнопка сохранения готового заблокированного сайта с вшитым фото
            document.getElementById('exportBtn').addEventListener('click', () => {
                if (!loadedUserImage) {
                    alert('Сначала нажми «📸 Натянуть моё фото» и настрой лицо!');
                    return;
                }
                const bakedDataUrl = faceCanvas.toDataURL('image/jpeg', 0.92);
                const clone = document.documentElement.cloneNode(true);

                const clonedContainer = clone.querySelector('#canvas-container');
                if (clonedContainer) clonedContainer.innerHTML = '';

                const tuner = clone.querySelector('#faceTuner');
                if (tuner) tuner.remove();
                const photoLabel = clone.querySelector('#photoLabel');
                if (photoLabel) photoLabel.remove();
                const exportBtn = clone.querySelector('#exportBtn');
                if (exportBtn) exportBtn.remove();

                const sub = clone.querySelector('.subtitle');
                if (sub) sub.textContent = 'Вращай камеру мышкой • Нажимай кнопки снизу';

                clone.querySelector('body').setAttribute('data-baked-face', bakedDataUrl);

                const finalHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
                const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // --- ЗВУК И АНИМАЦИЯ ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playKentonganHit(time, pitch = 210) {
            [1, 1.48].forEach((mult, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = idx === 0 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(pitch * mult, time);
                osc.frequency.exponentialRampToValueAtTime(pitch * mult * 0.65, time + 0.13);
                gain.gain.setValueAtTime(idx === 0 ? 0.55 : 0.28, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(time);
                osc.stop(time + 0.15);
            });
        }

        function playSahurChant() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [0, 0.14, 0.28, 0.42, 0.56, 0.70, 0.84].forEach((offset, i) => {
                playKentonganHit(now + offset, 205 + (i % 2) * 28);
            });
            [1.05, 1.28].forEach((offset, idx) => {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(idx === 0 ? 110 : 88, now + offset);
                osc.frequency.exponentialRampToValueAtTime(idx === 0 ? 95 : 65, now + offset + 0.28);
                filter.type = 'bandpass';
                filter.frequency.value = idx === 0 ? 750 : 480;
                filter.Q.value = 3.5;
                gain.gain.setValueAtTime(0.45, now + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.32);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + offset);
                osc.stop(now + offset + 0.34);
            });
        }

        let isWalking = false;
        let isStudioLight = false;
        let attackTimer = 0;
        const mouse = new THREE.Vector2(0, 0);

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        const banner = document.getElementById('sahurBanner');
        document.getElementById('sahurBtn').addEventListener('click', () => {
            attackTimer = 1.45;
            playSahurChant();
            banner.classList.add('active');
            setTimeout(() => banner.classList.remove('active'), 1400);
        });

        document.getElementById('walkBtn').addEventListener('click', (e) => {
            isWalking = !isWalking;
            e.target.textContent = isWalking ? '⏹ Остановить' : '🚶 Походка мема';
            if (isWalking) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playKentonganHit(audioCtx.currentTime, 220);
            }
        });

        document.getElementById('lightBtn').addEventListener('click', () => {
            isStudioLight = !isStudioLight;
            if (isStudioLight) {
                scene.background = new THREE.Color(0x282422);
                scene.fog.density = 0.005;
                hemiLight.intensity = 2.6;
                environmentGroup.visible = false;
            } else {
                scene.background = new THREE.Color(0x070a12);
                scene.fog.density = 0.032;
                hemiLight.intensity = 1.85;
                environmentGroup.visible = true;
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const t = clock.getElapsedTime();

            headGroup.rotation.y += (mouse.x * 0.35 - headGroup.rotation.y) * 0.1;
            headGroup.rotation.x += (-mouse.y * 0.22 - headGroup.rotation.x) * 0.1;

            if (isWalking) {
                const walkSpeed = 7.5;
                characterRoot.position.y = Math.abs(Math.sin(t * walkSpeed)) * 0.14;
                characterRoot.rotation.z = Math.cos(t * walkSpeed) * 0.05;
                characterRoot.rotation.y = Math.sin(t * 1.8) * 0.3;

                leftLeg.hip.rotation.x = Math.sin(t * walkSpeed) * 0.52;
                leftLeg.shinGroup.rotation.x = Math.max(0, -Math.sin(t * walkSpeed)) * 0.45;
                rightLeg.hip.rotation.x = -Math.sin(t * walkSpeed) * 0.52;
                rightLeg.shinGroup.rotation.x = Math.max(0, Math.sin(t * walkSpeed)) * 0.45;
            } else {
                characterRoot.position.y = Math.sin(t * 2.2) * 0.02;
                characterRoot.rotation.z = 0;
                characterRoot.rotation.y = Math.sin(t * 0.7) * 0.06;

                leftLeg.hip.rotation.x = 0;
                leftLeg.shinGroup.rotation.x = 0;
                rightLeg.hip.rotation.x = 0;
                rightLeg.shinGroup.rotation.x = 0;
            }

            if (attackTimer > 0) {
                attackTimer -= dt;
                rightArm.sh.rotation.x = -0.3 + Math.sin(t * 42) * 0.45;
                headGroup.rotation.z = Math.sin(t * 42) * 0.08;
            } else {
                rightArm.sh.rotation.x = 0.25 + Math.sin(t * 2.2) * 0.04;
                headGroup.rotation.z = 0;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>

</body></html>
